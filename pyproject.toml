[project]
name = "pnl-skill"
version = "0.1.0"
description = "A Claude Skill that analyzes labor cost across a portfolio of hotel P&L statements."
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pandera[pandas]>=0.20",
    "duckdb>=1.0",
    "pyarrow>=16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
